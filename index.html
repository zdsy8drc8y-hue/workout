<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Builder Pro</title>

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#fff;
--accent:#4f46e5;
--muted:#94a3b8;
}

.light{
--bg:#f5f5f7;
--card:#fff;
--text:#111;
}

body{
margin:0;
font-family:-apple-system,system-ui;
background:var(--bg);
color:var(--text);
}

.container{
max-width:430px;
margin:auto;
padding:18px;
}

h2{margin:8px 0 16px}

.card{
background:var(--card);
padding:16px;
border-radius:18px;
margin-top:14px;
box-shadow:0 8px 25px rgba(0,0,0,.25);
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:14px;
font-weight:600;
background:var(--accent);
color:white;
}

.secondary{background:var(--card);color:var(--text)}
.small{font-size:14px;color:var(--muted)}
.hidden{display:none}
input,select{
width:100%;
padding:12px;
border-radius:12px;
border:none;
margin-top:8px;
font-size:16px;
}
</style>
</head>

<body>
<div class="container">

<!-- SETUP -->
<div id="setup">

<h2>Setup Your Gym</h2>

<div class="card" id="equipList">
<label><input type="checkbox" value="bench"> Bench</label><br>
<label><input type="checkbox" value="dumbbell"> Dumbbells</label><br>
<label><input type="checkbox" value="barbell"> Barbell</label><br>
<label><input type="checkbox" value="rack"> Squat Rack</label><br>
<label><input type="checkbox" value="band"> Bands</label><br>
<label><input type="checkbox" value="kettlebell"> Kettlebell</label><br>
<label><input type="checkbox" value="machine"> Machines</label><br>
<label><input type="checkbox" value="body"> Bodyweight</label>
</div>

<div class="card">
<div class="small">Days per week</div>
<select id="days">
<option value="2">2 days</option>
<option value="3">3 days</option>
<option value="4" selected>4 days</option>
<option value="5">5 days</option>
<option value="6">6 days</option>
<option value="7">7 days</option>
</select>
</div>

<button onclick="saveSetup()">Build My Plan</button>
</div>


<!-- HOME -->
<div id="home" class="hidden">
<h2>Your Workouts</h2>
<div id="workoutButtons"></div>

<button class="secondary" onclick="resetSetup()">Change Setup</button>
<button class="secondary" onclick="toggleTheme()">Theme</button>
</div>


<!-- WORKOUT -->
<div id="workout" class="hidden">

<h2 id="title"></h2>

<div class="card">
<div id="exercise" style="font-size:20px;font-weight:600"></div>
<div id="reps" class="small"></div>
</div>

<button onclick="nextExercise()">Next Exercise</button>
<button class="secondary" onclick="goHome()">Back</button>
</div>

</div>

<script>

/* ---------------- DATABASE ---------------- */

const exercises=[

{name:"Barbell Bench Press",equip:["barbell","bench"],type:"push"},
{name:"Dumbbell Bench Press",equip:["dumbbell","bench"],type:"push"},
{name:"Push Ups",equip:["body"],type:"push"},

{name:"Barbell Squat",equip:["barbell","rack"],type:"legs"},
{name:"Goblet Squat",equip:["dumbbell","kettlebell"],type:"legs"},
{name:"Bodyweight Squat",equip:["body"],type:"legs"},

{name:"Barbell Rows",equip:["barbell"],type:"pull"},
{name:"Dumbbell Rows",equip:["dumbbell"],type:"pull"},
{name:"Band Pulldown",equip:["band"],type:"pull"},

{name:"Shoulder Press",equip:["dumbbell","barbell"],type:"push"},
{name:"Lunges",equip:["body","dumbbell"],type:"legs"},
{name:"Curls",equip:["dumbbell","barbell"],type:"arms"}
];


/* ---------------- STATE ---------------- */

let equipment, daysPerWeek;
let workouts=[];
let ei=0,currentDay=0;


/* ---------------- BUILD SMART PLAN ---------------- */

function buildPlan(){

workouts=[];

const types=["push","pull","legs","arms"];

for(let d=0;d<daysPerWeek;d++){

let dayType=types[d%types.length];

let list=exercises.filter(ex=>
ex.type===dayType &&
ex.equip.some(e=>equipment.includes(e))
);

workouts.push(list);
}

}


/* ---------------- SETUP ---------------- */

function saveSetup(){

equipment=[...document.querySelectorAll("#equipList input:checked")].map(x=>x.value);
daysPerWeek=parseInt(document.getElementById("days").value);

localStorage.setItem("setup",JSON.stringify({equipment,daysPerWeek}));

startApp();
}

function resetSetup(){
localStorage.removeItem("setup");
location.reload();
}

function startApp(){

document.getElementById("setup").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

buildPlan();
renderButtons();
}

let saved=JSON.parse(localStorage.getItem("setup"));
if(saved){
equipment=saved.equipment;
daysPerWeek=saved.daysPerWeek;
startApp();
}


/* ---------------- HOME ---------------- */

function renderButtons(){

let box=document.getElementById("workoutButtons");
box.innerHTML="";

workouts.forEach((_,i)=>{
let b=document.createElement("button");
b.textContent="Day "+(i+1)+" Workout";
b.onclick=()=>startWorkout(i);
box.appendChild(b);
});
}


/* ---------------- WORKOUT ---------------- */

function startWorkout(day){
currentDay=day;
ei=0;

document.getElementById("home").classList.add("hidden");
document.getElementById("workout").classList.remove("hidden");

title.textContent="Day "+(day+1);

showExercise();
}

function showExercise(){
let ex=workouts[currentDay][ei];
if(!ex){exercise.textContent="No exercises available";return;}
exercise.textContent=ex.name;
reps.textContent="3–4 sets • 8–12 reps";
}

function nextExercise(){
ei++;
if(ei>=workouts[currentDay].length) ei=0;
showExercise();
}

function goHome(){
document.getElementById("workout").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

function toggleTheme(){
document.body.classList.toggle("light");
}

</script>
</body>
</html>
