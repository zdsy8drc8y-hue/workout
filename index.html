<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout AI Pro</title>

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#fff;
--accent:#3b82f6;
--green:#22c55e;
}

.light{
--bg:#f2f2f7;
--card:#fff;
--text:#111;
}

body{
margin:0;
font-family:-apple-system;
background:var(--bg);
color:var(--text);
}

.container{
max-width:430px;
margin:auto;
padding:16px;
}

.card{
background:var(--card);
padding:16px;
border-radius:14px;
margin-top:12px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:600;
background:var(--accent);
color:white;
}

.secondary{background:var(--card);color:var(--text);}
.green{background:var(--green)}

.hidden{display:none}

input[type=checkbox]{
margin-right:8px;
}

.timer{color:var(--green);font-weight:bold}
</style>
</head>

<body>
<div class="container">

<!-- SETUP -->
<div id="setup">
<h2>Choose Your Equipment</h2>

<div class="card">
<label><input type="checkbox" value="bench"> Bench</label><br>
<label><input type="checkbox" value="dumbbell"> Dumbbells</label><br>
<label><input type="checkbox" value="band"> Bands</label><br>
<label><input type="checkbox" value="kettlebell"> Kettlebell</label><br>
<label><input type="checkbox" value="body"> Bodyweight</label>
</div>

<button onclick="saveEquipment()">Start App</button>
</div>


<!-- HOME -->
<div id="home" class="hidden">
<h2>🏋️ Workout AI</h2>

<button onclick="startWorkout(0)">Day 1 – Upper</button>
<button onclick="startWorkout(1)">Day 2 – Pull</button>
<button onclick="startWorkout(2)">Day 3 – Push Pump</button>
<button onclick="startWorkout(3)">Day 4 – Legs</button>

<button class="secondary" onclick="toggleTheme()">Theme</button>
<button class="secondary" onclick="resetEquipment()">Change Equipment</button>
</div>


<!-- WORKOUT -->
<div id="workout" class="hidden">

<h3 id="title"></h3>

<div class="card">
<div id="exercise"></div>
<div id="reps"></div>
<div class="timer" id="timer">0:00</div>
</div>

<button class="green" onclick="nextExercise()">Next</button>
<button class="secondary" onclick="goHome()">Back</button>
</div>

</div>

<script>

/* ---------- EXERCISE DATABASE ---------- */

const db = [

{ name:"DB Bench Press", equip:["bench","dumbbell"], day:0, reps:"4x8" },
{ name:"Pushups", equip:["body"], day:0, reps:"4x15" },

{ name:"DB Rows", equip:["dumbbell"], day:1, reps:"4x8" },
{ name:"Band Pulldown", equip:["band"], day:1, reps:"4x12" },

{ name:"DB Flyes", equip:["bench","dumbbell"], day:2, reps:"3x12" },

{ name:"Goblet Squat", equip:["kettlebell","dumbbell"], day:3, reps:"4x10" },
{ name:"Bodyweight Squat", equip:["body"], day:3, reps:"4x20" }

];

/* ---------- STATE ---------- */

let equipment = JSON.parse(localStorage.getItem("equip")||"null");
let workouts=[];
let ei=0;

let seconds=0, interval;

/* ---------- BUILD WORKOUTS ---------- */

function buildWorkouts(){
workouts=[[],[],[],[]];

db.forEach(ex=>{
if(ex.equip.some(e=>equipment.includes(e))){
workouts[ex.day].push(ex);
}
});
}

/* ---------- SETUP ---------- */

function saveEquipment(){
equipment=[...document.querySelectorAll("input:checked")].map(x=>x.value);
localStorage.setItem("equip",JSON.stringify(equipment));
startApp();
}

function resetEquipment(){
localStorage.removeItem("equip");
location.reload();
}

/* ---------- APP START ---------- */

function startApp(){
document.getElementById("setup").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
buildWorkouts();
}

if(equipment) startApp();

/* ---------- WORKOUT ---------- */

function startWorkout(day){
ei=0;

document.getElementById("home").classList.add("hidden");
document.getElementById("workout").classList.remove("hidden");

title.textContent="Workout "+(day+1);

showExercise(day);

seconds=0;
interval=setInterval(()=>{
seconds++;
let m=Math.floor(seconds/60);
let s=(seconds%60).toString().padStart(2,"0");
timer.textContent=m+":"+s;
},1000);

currentDay=day;
}

function showExercise(day){
if(!workouts[day].length){
exercise.textContent="No exercises for your equipment";
reps.textContent="";
return;
}

let ex=workouts[day][ei];
exercise.textContent=ex.name;
reps.textContent=ex.reps;
}

function nextExercise(){
ei++;
if(ei>=workouts[currentDay].length) ei=0;
showExercise(currentDay);
}

function goHome(){
clearInterval(interval);
document.getElementById("workout").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

function toggleTheme(){
document.body.classList.toggle("light");
}

</script>
</body>
</html>
