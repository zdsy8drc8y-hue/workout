<script>
const beep=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

/* ---------------- DATA ---------------- */

const workouts=[
["Dumbbell Bench Press","4x6-8","Drive feet into floor"],
["Bent Over Rows","4x6-8","Squeeze shoulder blades"],
["Incline Press","4x10-12","Control tempo"],
["Goblet Squats","4x8-10","Chest tall & deep squat"]
];

let e=0,sets=0,totalSets=0;

/* ---------------- STORAGE ---------------- */

let stats=JSON.parse(localStorage.getItem("stats")||`{
"workouts":0,
"sets":0,
"last":"",
"weights":{},
"streak":0,
"best":0
}`);

/* ---------------- ELEMENTS ---------------- */

const home=document.getElementById("home");
const workout=document.getElementById("workout");
const statsDiv=document.getElementById("stats");
const schedule=document.getElementById("schedule");

const exEl=document.getElementById("exercise");
const repsEl=document.getElementById("reps");
const tipEl=document.getElementById("tip");
const timerEl=document.getElementById("timer");
const setsEl=document.getElementById("sets");
const weightInput=document.getElementById("weightInput");
const title=document.getElementById("title");

/* ---------------- STREAK LOGIC ---------------- */

function updateStreak(){

const today=new Date();
const todayStr=today.toDateString();

if(!stats.last){
stats.streak=1;
}
else{
const last=new Date(stats.last);

const diff=(today-last)/(1000*60*60*24);

if(diff<1){
/* same day → no change */
}
else if(diff<=2){
stats.streak++;
}
else{
stats.streak=1;
}
}

if(stats.streak>stats.best){
stats.best=stats.streak;
}

stats.last=todayStr;
}

/* ---------------- THEME ---------------- */

function toggleTheme(){
document.body.classList.toggle("light");
}

/* ---------------- WORKOUT ---------------- */

function startWorkout(i){
home.style.display="none";
workout.style.display="block";
title.innerText=document.querySelectorAll("#home button")[i].innerText;
sets=0;
totalSets=0;
update();
}

function update(){
const ex=workouts[e];
exEl.innerText=ex[0];
repsEl.innerText=ex[1];
tipEl.innerText="";
setsEl.innerText="Set "+sets;
weightInput.value=stats.weights[ex[0]]||"";
}

function addSet(){
sets++;
totalSets++;
setsEl.innerText="Set "+sets;
}

function showTip(){
tipEl.innerText=workouts[e][2];
}

/* ---------------- REST ---------------- */

function startRest(){
let t=90;
timerEl.innerText="Rest: 90s";

const interval=setInterval(()=>{
t--;
timerEl.innerText="Rest: "+t+"s";

if(t<=0){
clearInterval(interval);
timerEl.innerText="GO!";
beep.play();

if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}
}
},1000);
}

/* ---------------- WEIGHTS ---------------- */

function saveWeight(){
stats.weights[workouts[e][0]]=weightInput.value;
localStorage.setItem("stats",JSON.stringify(stats));
}

/* ---------------- FINISH WORKOUT ---------------- */

function finishWorkout(){

stats.workouts++;
stats.sets+=totalSets;

updateStreak();

localStorage.setItem("stats",JSON.stringify(stats));

alert("Workout logged! 🔥 Streak: "+stats.streak+" days");

goHome();
}

/* ---------------- STATS SCREEN ---------------- */

function showStats(){
home.style.display="none";
statsDiv.style.display="block";

let html="";

for(let k in stats.weights){
html+=k+": "+stats.weights[k]+"<br>";
}

document.getElementById("statsContent").innerHTML=
"<b>🔥 Current Streak:</b> "+stats.streak+" days<br>"+
"<b>🏆 Best Streak:</b> "+stats.best+" days<br><br>"+
"Workouts: "+stats.workouts+"<br>"+
"Total Sets: "+stats.sets+"<br><br>"+
html;
}

/* ---------------- NAV ---------------- */

function showSchedule(){
home.style.display="none";
schedule.style.display="block";
}

function goHome(){
workout.style.display="none";
statsDiv.style.display="none";
schedule.style.display="none";
home.style.display="block";
}
</script>
