<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Pro</title>

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#fff;
--accent:#3b82f6;
--green:#22c55e;
--danger:#ef4444;
--muted:#94a3b8;
}
.light{
--bg:#f2f2f7;
--card:#ffffff;
--text:#111;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:420px;
padding:18px;
}

button{
width:100%;
padding:14px;
margin:6px 0;
border-radius:14px;
border:none;
font-weight:600;
}

.primary{background:var(--accent);color:#fff;}
.secondary{background:var(--card);color:var(--text);}
.green{background:var(--green);color:#fff;}
.danger{background:var(--danger);color:#fff;}

.card{
background:var(--card);
padding:14px;
border-radius:14px;
margin-top:10px;
}

.fire{
text-align:center;
font-size:28px;
}

.timer{font-weight:bold;color:var(--green);}
.tip{font-size:14px;color:var(--muted);}
</style>
</head>

<body>
<div class="container">

<!-- HOME -->
<div id="homeScreen">
<h2>🏋️ Workout Pro</h2>
<div class="fire" id="fire">🔥 0</div>

<button class="primary" onclick="startWorkout(0)">Workout 1</button>
<button class="primary" onclick="startWorkout(1)">Workout 2</button>
<button class="primary" onclick="startWorkout(2)">Workout 3</button>
<button class="primary" onclick="startWorkout(3)">Workout 4</button>

<button class="secondary" onclick="showStats()">Stats</button>
<button class="secondary" onclick="toggleTheme()">Theme</button>
</div>


<!-- WORKOUT -->
<div id="workoutScreen" style="display:none">

<h3 id="title"></h3>

<div class="card">
⏱ <span id="workoutTimer">0:00</span>
</div>

<div class="card">
<div id="exercise"></div>
<div id="reps"></div>
<div class="tip" id="tip"></div>
<div id="sets">Set 0</div>
<div class="timer" id="restTimer">Rest: 90s</div>
</div>

<button class="green" onclick="addSet()">+ Set</button>
<button class="secondary" onclick="startRest()">Rest</button>
<button class="secondary" onclick="nextExercise()">Next</button>
<button class="danger" onclick="finishWorkout()">Finish</button>
<button class="secondary" onclick="goHome()">Back</button>

</div>


<!-- STATS -->
<div id="statsScreen" style="display:none">
<div class="card" id="statsText"></div>
<button class="secondary" onclick="goHome()">Back</button>
</div>

</div>


<script>

/* ---------- DATA ---------- */

const workouts = [
[
["Bench Press","4x6-8","Go heavy"],
["Incline Press","3x8-10","Upper chest"],
["Curls","3x10","Slow reps"]
],
[
["Rows","4x6-8","Pull tight"],
["Pulldowns","3x10-12","Squeeze lats"]
],
[
["Flyes","3x12-15","Stretch chest"]
],
[
["Squats","4x8-10","Deep squat"]
]
];

/* ---------- STATE ---------- */

let wi=0, ei=0, setCount=0;
let timerSeconds=0, timerInterval=null;

let stats = JSON.parse(localStorage.getItem("stats")||`{
"workouts":0,
"sets":0,
"streak":0
}`);

/* ---------- HELPERS ---------- */

function save(){
localStorage.setItem("stats",JSON.stringify(stats));
}

function hideAll(){
document.getElementById("homeScreen").style.display="none";
document.getElementById("workoutScreen").style.display="none";
document.getElementById("statsScreen").style.display="none";
}

/* ---------- TIMER ---------- */

function startTimer(){
if(timerInterval) clearInterval(timerInterval);
timerSeconds=0;

timerInterval=setInterval(()=>{
timerSeconds++;
let m=Math.floor(timerSeconds/60);
let s=(timerSeconds%60).toString().padStart(2,"0");
document.getElementById("workoutTimer").textContent=m+":"+s;
},1000);
}

function stopTimer(){
clearInterval(timerInterval);
}

/* ---------- WORKOUT FLOW ---------- */

function startWorkout(index){
wi=index;
ei=0;
setCount=0;

hideAll();
document.getElementById("workoutScreen").style.display="block";

document.getElementById("title").textContent="Workout "+(index+1);

loadExercise();
startTimer();
}

function loadExercise(){
let ex = workouts[wi][ei];

document.getElementById("exercise").textContent=ex[0];
document.getElementById("reps").textContent=ex[1];
document.getElementById("tip").textContent=ex[2];
document.getElementById("sets").textContent="Set 0";
}

function addSet(){
setCount++;
stats.sets++;
document.getElementById("sets").textContent="Set "+setCount;
save();
}

function nextExercise(){
if(ei < workouts[wi].length-1){
ei++;
setCount=0;
loadExercise();
}
}

function startRest(){
let t=90;
const el=document.getElementById("restTimer");

const i=setInterval(()=>{
t--;
el.textContent="Rest: "+t+"s";
if(t<=0){
clearInterval(i);
el.textContent="GO!";
navigator.vibrate && navigator.vibrate(200);
}
},1000);
}

function finishWorkout(){
stopTimer();
stats.workouts++;
stats.streak++;
save();

document.getElementById("fire").textContent="🔥 "+stats.streak;

goHome();
}

/* ---------- SCREENS ---------- */

function goHome(){
hideAll();
document.getElementById("homeScreen").style.display="block";
}

function showStats(){
hideAll();
document.getElementById("statsScreen").style.display="block";
document.getElementById("statsText").innerHTML=
"Workouts: "+stats.workouts+"<br>"+
"Sets: "+stats.sets+"<br>"+
"Streak: "+stats.streak;
}

function toggleTheme(){
document.body.classList.toggle("light");
}

document.getElementById("fire").textContent="🔥 "+stats.streak;

</script>
</body>
</html>
