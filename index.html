<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout App</title>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --accent:#3b82f6;
  --accent2:#22c55e;
  --text:#f8fafc;
  --muted:#94a3b8;
}

*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* HOME SCREEN */
#home{
  text-align:center;
  width:100%;
  max-width:420px;
  padding:20px;
}

h1{
  font-size:28px;
  margin-bottom:25px;
}

.workout-btn{
  width:100%;
  padding:18px;
  margin:10px 0;
  border:none;
  border-radius:14px;
  font-size:18px;
  font-weight:600;
  background:var(--accent);
  color:white;
}

.workout-btn:active{
  transform:scale(0.97);
}

/* WORKOUT SCREEN */
#workout{
  display:none;
  width:100%;
  max-width:420px;
  padding:20px;
  text-align:center;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:28px 18px;
  margin:20px 0;
}

#exerciseName{
  font-size:22px;
  font-weight:700;
}

#exerciseReps{
  color:var(--muted);
  margin-top:8px;
  font-size:17px;
}

.timer{
  margin-top:18px;
  font-size:26px;
  font-weight:bold;
  color:var(--accent2);
}

/* buttons */
.action{
  padding:14px 18px;
  margin:6px;
  border:none;
  border-radius:12px;
  font-size:15px;
  background:#334155;
  color:white;
}

/* progress bar */
#progressContainer{
  height:10px;
  background:#334155;
  border-radius:10px;
  overflow:hidden;
  margin:18px 0;
}

#progressBar{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width .3s;
}
</style>
</head>

<body>

<div id="home">
  <h1>🏋️ Workout App</h1>
  <button class="workout-btn" onclick="startWorkout(0)">Workout 1</button>
  <button class="workout-btn" onclick="startWorkout(1)">Workout 2</button>
  <button class="workout-btn" onclick="startWorkout(2)">Workout 3</button>
  <button class="workout-btn" onclick="startWorkout(3)">Workout 4</button>
</div>

<div id="workout">
  <h2 id="title"></h2>

  <div class="card">
    <div id="exerciseName"></div>
    <div id="exerciseReps"></div>
    <div class="timer" id="timer">Rest: 90s</div>
  </div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>

  <button class="action" onclick="prevExercise()">Back</button>
  <button class="action" onclick="startRest()">Rest</button>
  <button class="action" onclick="nextExercise()">Next</button>
  <br/>
  <button class="action" onclick="goHome()">Home</button>
</div>

<script>
const workouts=[
{title:"Workout 1: Arms & Chest",exercises:[
["Dumbbell Bench Press","4x6-8"],
["Incline DB Press","3x8-10"],
["Floor Press","3x8-10"],
["Dips","3x8-12"],
["Overhead Press","3x8-10"],
["Bicep Curls","3x8-10"],
["Tricep Extension","3x10-12"],
["Face Pulls","3x15-20"]
]},
{title:"Workout 2: Back & Core",exercises:[
["Rows","4x6-8"],
["Single Rows","3x8-10"],
["Lat Pulldowns","4x10-12"],
["Renegade Rows","3x6-8"],
["Pullovers","3x10-12"],
["Rollouts","3x8-12"],
["Twists","3x10"],
["Carries","3x40ft"]
]},
{title:"Workout 3: Pump",exercises:[
["Incline Press","4x10-12"],
["Chest Press","3x15-20"],
["Flyes","3x12-15"],
["Close Grip","3x10-12"],
["Strict Press","3x8-10"],
["Hammer Curl","3x10-12"],
["Pushdowns","4x15-20"],
["Concentration Curl","3x10-15"]
]},
{title:"Workout 4: Legs",exercises:[
["Goblet Squat","4x8-10"],
["RDL","4x8-10"],
["Split Squat","3x8-10"],
["Swings","4x15-20"],
["Hip Thrust","3x10-15"],
["Lunges","3x10-12"],
["Band Squat","3x15"],
["Calf Raise","5x15-20"]
]}
];

let w=0,e=0,timerInt;

const home=document.getElementById("home");
const workout=document.getElementById("workout");
const title=document.getElementById("title");
const nameEl=document.getElementById("exerciseName");
const repsEl=document.getElementById("exerciseReps");
const timerEl=document.getElementById("timer");
const progress=document.getElementById("progressBar");

function startWorkout(i){
  w=i;e=0;
  home.style.display="none";
  workout.style.display="block";
  load();
}

function load(){
  const ex=workouts[w].exercises[e];
  title.innerText=workouts[w].title;
  nameEl.innerText=ex[0];
  repsEl.innerText=ex[1];
  progress.style.width=(e/workouts[w].exercises.length)*100+"%";
}

function nextExercise(){
  if(e<workouts[w].exercises.length-1){e++;load();}
  else{timerEl.innerText="Workout Complete!";}
}

function prevExercise(){
  if(e>0){e--;load();}
}

function startRest(){
  let t=90;
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    timerEl.innerText="Rest: "+t+"s";
    t--;
    if(t<0){
      clearInterval(timerInt);
      timerEl.innerText="Go!";
    }
  },1000);
}

function goHome(){
  clearInterval(timerInt);
  workout.style.display="none";
  home.style.display="block";
}
</script>

</body>
</html>
